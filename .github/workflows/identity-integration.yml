name: Identity integration tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  mongodb-replica-set:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start disposable single-node MongoDB replica set
        run: |
          docker run -d --rm --name learnsphere-mongo -p 27017:27017 mongo:8.0 mongod --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec learnsphere-mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec learnsphere-mongo mongosh --quiet --eval 'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] })'
          for attempt in $(seq 1 30); do
            if docker exec learnsphere-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then exit 0; fi
            sleep 2
          done
          echo "MongoDB replica set did not become primary" >&2
          exit 1
      - name: Run isolated identity integration suite
        env:
          LMS_INTEGRATION_MONGODB_URI: mongodb://127.0.0.1:27017/learnsphere_phase2_test?replicaSet=rs0
        run: npm run test:integration
      - name: Remove disposable MongoDB container
        if: always()
        run: docker rm -f learnsphere-mongo || true
